[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "context-guard"
version = "0.1.0"
description = "Offline-first safety validation for compressed context"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "ContextGuard contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
semantic = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "protobuf>=4.25,<7",
  "sentencepiece>=0.2,<1",
]
compressors = ["llmlingua>=0.2,<1"]
benchmark = ["psutil>=5.9,<7"]
all = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psutil>=5.9,<7",
]

[dependency-groups]
core = ["pydantic>=2.7,<3"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
semantic = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "protobuf>=4.25,<7",
  "sentencepiece>=0.2,<1",
]
compressors = ["llmlingua>=0.2,<1"]
benchmark = ["psutil>=5.9,<7"]
all = [
  { include-group = "api" },
  { include-group = "semantic" },
  { include-group = "compressors" },
  { include-group = "benchmark" },
  { include-group = "dev" },
]
dev = [
  { include-group = "api" },
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
context-guard = "context_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_guard"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["contract: API contract tests", "regression: regression tests"]

[tool.coverage.run]
branch = true
source = ["context_guard"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["context_guard"]
mypy_path = "src"

[tool.uv]
default-groups = ["dev"]
